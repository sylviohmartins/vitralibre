<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VitraLibre · verificação de larguras</title><style>body{margin:0;background:#dce4dc;font:16px system-ui}header{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:12px;align-items:center;z-index:2;flex-wrap:wrap}select{padding:10px}iframe{display:block;border:0;background:#fff;height:900px;max-width:none;margin:16px;width:390px}</style><header><label>Largura da superfície<select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>520</option><option>768</option><option>1024</option><option>1280</option><option>1440</option></select></label><label>Superfície<select id="surface"><option value="./index.html">Editor</option><option value="./restaurant.html">Restaurante</option><option value="./retail.html">Loja</option></select></label><output id="measurement"></output></header><iframe title="Superfície sob teste" src="./index.html"></iframe><script>const frame=document.querySelector('iframe');function measure(){const d=frame.contentDocument;if(!d)return;document.getElementById('measurement').textContent=JSON.stringify({requested:Number(document.getElementById('width').value),frameWidth:frame.getBoundingClientRect().width,viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth})}function applyWidth(){const d=frame.contentDocument;const gutter=d?Math.max(0,frame.getBoundingClientRect().width-d.documentElement.clientWidth):15;frame.style.width=(Number(document.getElementById('width').value)+gutter)+'px';requestAnimationFrame(()=>requestAnimationFrame(measure))}document.getElementById('width').onchange=applyWidth;document.getElementById('surface').onchange=e=>{frame.src=e.target.value};frame.onload=()=>{applyWidth();new ResizeObserver(measure).observe(frame.contentDocument.documentElement)};</script></html>
