name: CADCraft MCP E2E (experimental)

on:
  pull_request:
    paths:
      - 'extensions/cadcraft/**'
      - 'tests/cadcraft*.test.mjs'
      - '.github/workflows/cadcraft-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cadcraft-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download pinned upstream binary and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          version=0.17.0
          file="cadcraft-${version}-linux-x86_64.tar.gz"
          base="https://github.com/storytold/cadcraft/releases/download/v${version}"
          curl --fail --location --retry 3 --max-time 180 -o "$file" "$base/$file"
          curl --fail --location --retry 3 --max-time 60 -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          grep -F "  $file" SHA256SUMS.txt | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cadcraft"
          tar -xzf "$file" -C "$RUNNER_TEMP/cadcraft"
          binary="$(find "$RUNNER_TEMP/cadcraft" -type f -path "*/bin/cadcraft-cli" -print -quit)"
          if [[ -z "$binary" ]]; then
            echo "::error::Release archive does not include cadcraft-cli"
            exit 1
          fi
          chmod +x "$binary"
          echo "CADCRAFT_BIN=$binary" >> "$GITHUB_ENV"
          "$binary" --version
      - name: Real MCP PNG and DXF round trip
        env:
          CADCRAFT_REAL_E2E: '1'
          CADCRAFT_ARTIFACTS_DIR: ${{ runner.temp }}/cadcraft-evidence
        run: node --test tests/cadcraft-real.test.mjs
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npm run build
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Chromium browser journey (real CADCraft MCP)
        env:
          CADCRAFT_ARTIFACTS_DIR: ${{ runner.temp }}/cadcraft-evidence
        run: node --test tests/cadcraft-browser.e2e.mjs
      - name: Upload generated CAD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadcraft-600x400
          path: ${{ runner.temp }}/cadcraft-evidence/
          if-no-files-found: ignore
          retention-days: 7
